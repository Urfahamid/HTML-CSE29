<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Air Jordan | CSS Magic</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

/* ---------- NAV ---------- */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
}

nav ul li{
    font-size:14px;
    opacity:0.7;
}

.logo{
    font-weight:700;
    letter-spacing:3px;
}

/* ---------- HERO ---------- */
.hero{
    min-height:90vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    text-align:center;
}

/* BIG BACK TEXT */
.hero::before{
    content:"AIR JORDAN 1";
    position:absolute;
    font-size:10vw;
    opacity:0.04;
    letter-spacing:10px;
    top:20%;
    white-space:nowrap;
}

/* ---------- SHOE ---------- */
.shoe-box{
    position:relative;
}

.shoe-box img{
    width:320px;
    animation:float 4s ease-in-out infinite;
    transition:0.6s;
}

/* FLOAT */
@keyframes float{
    0%{transform:translateY(0) rotate(-8deg);}
    50%{transform:translateY(-25px) rotate(-8deg);}
    100%{transform:translateY(0) rotate(-8deg);}
}

/* CLICK EFFECT */
.shoe-box:target img{
    animation:float-strong 2s ease-in-out infinite;
    filter:drop-shadow(0 30px 40px red);
}

@keyframes float-strong{
    0%{transform:translateY(0) scale(1.05);}
    50%{transform:translateY(-40px) scale(1.1);}
    100%{transform:translateY(0) scale(1.05);}
}

/* ---------- DETAILS ---------- */
.details{
    margin-top:30px;
}

.details h1{
    font-size:2.2rem;
    letter-spacing:2px;
}

.price{
    margin:10px 0;
    color:#ff4d4d;
    font-size:1.2rem;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 28px;
    border-radius:30px;
    background:#fff;
    color:#000;
    text-decoration:none;
    font-weight:500;
    transition:0.4s;
}

.btn:hover{
    background:red;
    color:white;
}

/* ---------- BOTTOM SHOES ---------- */
.slider{
    display:flex;
    gap:20px;
    padding:40px;
    justify-content:center;
}

.card{
    width:120px;
    height:90px;
    background:#111;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.4s;
}

.card img{
    width:90px;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 40px rgba(255,0,0,0.3);
}

/* ---------- FOOTER ---------- */
footer{
    text-align:center;
    opacity:0.4;
    padding-bottom:20px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">NIKE</div>
    <ul>
        <li>MEN</li>
        <li>WOMEN</li>
        <li>KIDS</li>
    </ul>
</nav>

<section class="hero">

    <a href="#focus" class="shoe-box" id="focus">
        <img src="https://i.imgur.com/2nCt3Sbl.png" alt="Air Jordan">
    </a>

    <div class="details">
        <h1>AIR JORDAN 1</h1>
        <div class="price">$275</div>
        <a href="#" class="btn">More Details</a>
    </div>

</section>

<section class="slider">
    <div class="card"><img src="./12960349_13486594_1000.webp"></div>
    <div class="card"><img src="https://i.imgur.com/KH5R5Pgl.png"></div>
    <div class="card"><img src="https://i.imgur.com/QlRphfNl.png"></div>
</section>

<footer>
    © 2025 Nike • CSS Only Concept
</footer>

</body>
</html>
